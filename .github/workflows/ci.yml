name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pure:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -m "not pyscf and not slow and not cache" -q

  full:
    # Every test, including PySCF calculations, with a branch-coverage gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: >-
          uv run pytest -q --cov=pyscf_vscf --cov-report=term
          --cov-fail-under=78

  minimum-dependencies:
    # The declared lower bounds of the runtime dependencies, resolved without
    # the lockfile and independently of current development tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install --resolution lowest-direct .
      - run: uv pip install pytest
      - run: >-
          uv pip list | grep -i -E '^(numpy|scipy|pyscf|geometric) '
      - run: .venv/bin/python -m pytest -q -W ignore::DeprecationWarning

  archived-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run pytest -m cache -q
      - run: uv run python scripts/validate_archived_grids.py --nmax 12 --output regenerated-report.json
      - run: >-
          uv run python scripts/compare_validation_reports.py
          validation_data/convergence_report.json regenerated-report.json
      - run: >-
          uv run python scripts/validate_nh3_three_mode.py
          --output regenerated-nh3-report.json
      - run: >-
          uv run python scripts/compare_validation_reports.py
          validation_data/nh3_three_mode/report.json regenerated-nh3-report.json

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: uv run --isolated --no-project --with ./dist/*.whl python -m pyscf_vscf.examples.vscf_two_mode
      - run: uv run --isolated --no-project --with ./dist/*.whl python -m pyscf_vscf.examples.nmode_vci
      - run: uv run --isolated --no-project --with ./dist/*.tar.gz python -m pyscf_vscf.examples.vscf_two_mode
      - run: uv run --isolated --no-project --with ./dist/*.tar.gz python -m pyscf_vscf.examples.nmode_vci
