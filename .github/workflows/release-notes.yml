name: Release notes

# Sets the body of existing GitHub releases from CHANGELOG.md, for releases
# published before the release workflow did so. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags (empty: every release with a changelog section)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set release bodies from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          tags="$TAGS"
          if [ -z "$tags" ]; then
            tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          fi
          for tag in $tags; do
            if ! notes=$(python3 scripts/release_notes.py "${tag#v}"); then
              echo "::warning::no changelog section for ${tag}; release left unchanged"
              continue
            fi
            # A failed read must stop the run: the comparison link exists only in the
            # current body. Only a missing comparison line is tolerated.
            if ! body=$(gh release view "$tag" --json body --jq .body); then
              echo "::error::could not read release ${tag}"
              exit 1
            fi
            compare=$(printf '%s\n' "$body" | grep -m1 '^\*\*Full Changelog\*\*' || true)
            printf '%s\n\n%s\n' "$notes" "$compare" > body.md
            gh release edit "$tag" --notes-file body.md
            echo "updated ${tag}"
          done
