# Read the Docs: builds the MkDocs site for main ("latest"), every release tag,
# and "stable" (the newest release). Dependencies come from uv.lock via the
# docs extra; warnings fail the build, as in CI.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: uv
      command: sync
      extras:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
