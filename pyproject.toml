[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscf-vscf"
version = "0.3.0"
description = "Variational anharmonic vibrational spectroscopy (DVR, VSCF, VCI) on PySCF potential and dipole surfaces"
authors = [
    { name = "Diogo Valada" }
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["VSCF", "DVR", "PySCF", "vibrational spectroscopy", "quantum chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23.2",
    "scipy>=1.13",
    "pyscf>=2.3",
    "geometric>=1.0.2"
]

[project.urls]
Homepage = "https://github.com/diogovalada/pyscf-vscf"
Documentation = "https://pyscf-vscf.readthedocs.io/"
Repository = "https://github.com/diogovalada/pyscf-vscf"
Issues = "https://github.com/diogovalada/pyscf-vscf/issues"
Changelog = "https://github.com/diogovalada/pyscf-vscf/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff>=0.15,<0.16",
    "mypy>=1.10",
    "twine"
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=1.0"
]

[project.scripts]
pyscf-vscf = "pyscf_vscf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyscf_vscf = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "pyscf: requires the PySCF backend",
    "slow: slow tests not intended for default local runs",
    "scientific: scientific regression or benchmark checks",
    "cache: requires existing cache artifacts",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# Pin the rule selection so lint results do not change with ruff's defaults.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["pyscf_vscf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = [
    "src/pyscf_vscf/_phase.py",
    "src/pyscf_vscf/_warnings.py",
    "src/pyscf_vscf/contracts.py",
    "src/pyscf_vscf/point_store.py",
    "src/pyscf_vscf/runner.py",
    "src/pyscf_vscf/scans.py",
    "src/pyscf_vscf/artifacts",
    "src/pyscf_vscf/backends/_pyscf_factory.py",
    "src/pyscf_vscf/backends/_pyscf_properties.py",
]
strict = true
# Third-party array and PySCF objects are untyped at the boundary.
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["pyscf_vscf._identity", "pyscf_vscf._arrays", "pyscf_vscf.cache", "pyscf_vscf.coordinates", "pyscf_vscf.io", "pyscf_vscf.settings", "pyscf_vscf.molecule", "pyscf_vscf.constants", "pyscf_vscf.workflows.*", "pyscf_vscf.variational", "pyscf_vscf._artifacts"]
follow_imports = "silent"
