# geomeTRIC logging used by optimize_geometry() unless the pyscf_vscf logger
# shows INFO messages: only warnings and errors reach standard error.
[loggers]
keys=root

[handlers]
keys=stream_handler

[formatters]
keys=formatter

[logger_root]
level=WARNING
handlers=stream_handler

[handler_stream_handler]
class=geometric.nifty.RawStreamHandler
level=WARNING
formatter=formatter
args=(sys.stderr,)

[formatter_formatter]
format=%(message)s
